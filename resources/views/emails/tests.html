<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Dashboard Template</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: Arial, sans-serif; }
    #sidebar {
      min-width: 250px; max-width: 250px;
      background: #343a40; color: #fff;
      height: 100vh;
    }
    #sidebar .nav-link { color: #adb5bd; }
    #sidebar .nav-link.active, #sidebar .nav-link:hover {
      color: #fff; background: #495057;
    }
    #content { width: 100%; }
    .navbar { background: #fff; }
    .footer { background: #f8f9fa; padding: 1rem 0; text-align: center; }
  </style>
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <nav id="sidebar" class="d-flex flex-column p-3">
      <a href="#" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
        <i class="fa-solid fa-chart-line fa-lg me-2"></i><span class="fs-4">My Dashboard</span>
      </a>
      <hr>
      <ul class="nav nav-pills flex-column mb-auto">
        <li><a href="#" class="nav-link active"><i class="fa-solid fa-house me-2"></i>Home</a></li>
        <li><a href="#" class="nav-link"><i class="fa-solid fa-table me-2"></i>Data</a></li>
        <li><a href="#" class="nav-link"><i class="fa-solid fa-chart-pie me-2"></i>Reports</a></li>
        <li><a href="#" class="nav-link"><i class="fa-solid fa-users me-2"></i>Users</a></li>
      </ul>
      <hr>
      <div class="mt-auto">
        <a href="#" class="nav-link text-white"><i class="fa-solid fa-cog me-2"></i>Settings</a>
      </div>
    </nav>

    <!-- Page Content -->
    <div id="content">
      <!-- Header/Navbar -->
      <nav class="navbar navbar-expand navbar-light border-bottom">
        <div class="container-fluid">
          <button class="btn btn-outline-secondary me-2" id="sidebarToggle">
            <i class="fa-solid fa-bars"></i>
          </button>
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-bell"></i></a></li>
            <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-user-circle"></i></a></li>
          </ul>
        </div>
      </nav>

      <!-- Main Dashboard -->
      <main class="p-4">
        <div class="row g-4">
          <div class="col-lg-4 col-md-6">
            <div class="card p-3">
              <div class="d-flex align-items-center">
                <div class="me-3"><i class="fa-solid fa-wallet fa-2x text-primary"></i></div>
                <div>
                  <h5>Revenue</h5>
                  <h3>$12,345</h3>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-4 col-md-6">
            <div class="card p-3">
              <div class="d-flex align-items-center">
                <div class="me-3"><i class="fa-solid fa-users fa-2x text-success"></i></div>
                <div>
                  <h5>New Users</h5>
                  <h3>1,234</h3>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-4 col-md-6">
            <div class="card p-3">
              <div class="d-flex align-items-center">
                <div class="me-3"><i class="fa-solid fa-chart-line fa-2x text-warning"></i></div>
                <div>
                  <h5>Sessions</h5>
                  <h3>8,765</h3>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card mt-4 p-3">
          <h5>Monthly Sales</h5>
          <canvas id="salesChart" height="100"></canvas>
        </div>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <div class="container">
          <span class="text-muted">&copy; 2025 Company Name. All rights reserved.</span>
        </div>
      </footer>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Toggle sidebar
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('d-none');
    });

    // Chart.js: Monthly sales example
    const ctx = document.getElementById('salesChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
        datasets: [{
          label: 'Sales',
          data: [1200,1500,1700,1400,1800,2100,2400,2000,2300,2500,2700,3000],
          borderColor: '#007bff',
          backgroundColor: 'rgba(0,123,255,0.1)',
          fill: true,
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  </script>
</body>
</html>
